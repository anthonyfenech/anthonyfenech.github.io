<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anthony Fenech</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background-color: #fefefe;
            color: #333;
            line-height: 1.6;
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
            overflow-y: scroll;
        }
        
        .header {
            text-align: center;
            margin-bottom: 60px;
        }
        
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 40px;
            width: 100%;
            margin-bottom: 40px;
        }
        
        .nav-link {
            color: #333;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-bottom: 2px;
            transition: text-decoration-color 0.3s ease;
            position: relative;
            display: inline-block;
        }
        
        .nav-link.underlined {
            text-decoration: underline;
            text-decoration-color: #333;
            text-decoration-thickness: 2px;
            text-underline-offset: 2px;
        }
        
        .nav-link:hover {
            text-decoration: underline;
            text-decoration-color: #333;
            text-decoration-thickness: 2px;
            text-underline-offset: 2px;
        }
        
        h1 {
            font-size: 48px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: bold;
        }

        .tagline {
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }
        
        .content {
            font-size: 18px;
            text-align: center;
        }
        
        p {
            margin-bottom: 20px;
        }
        
        @media (max-width: 600px) {
            .nav-links {
                flex-direction: column;
                gap: 20px;
                align-items: center;
            }
            
            body {
                padding: 20px 15px;
            }
            
            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav-links">
            <a href="index.html" class="nav-link underlined">Home</a>
            <a href="bio.html" class="nav-link underlined">Bio</a>
            <a href="portfolio.html" class="nav-link underlined">Portfolio</a>
            <a href="blog.html" class="nav-link underlined">Blog</a>
            <a href="contact.html" class="nav-link underlined">Contact</a>
        </nav>

        <h1>ANTHONY FENECH</h1>
        <p class="tagline">COPYWRITER. JOURNALIST. DIGITAL MARKETING.</p>
    </header>

    <div class="content">
    </div>
</body>
</html>
