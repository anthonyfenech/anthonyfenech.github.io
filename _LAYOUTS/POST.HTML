<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - Anthony Fenech</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.6;
            color: #333;
            overflow-y: scroll;
        }
        
        nav {
            background: #2c3e50;
            padding: 1rem 2rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        nav a {
            color: white;
            text-decoration: none;
            margin-right: 2rem;
            font-weight: 500;
        }
        
        nav a:hover {
            color: #3498db;
        }
        
        main {
            max-width: 800px;
            margin: 3rem auto;
            padding: 0 2rem;
        }
        
        article h1 {
            color: #2c3e50;
            margin-bottom: 0.5rem;
            font-size: 2.5rem;
        }
        
        .date {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        
        article p {
            color: #555;
            line-height: 1.8;
            margin-bottom: 1rem;
        }
        
        .back-link {
            margin-top: 3rem;
            display: inline-block;
            color: #3498db;
            text-decoration: none;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/index.html">Home</a>
        <a href="/bio.html">Bio</a>
        <a href="/about.html">About</a>
        <a href="/contact.html">Contact</a>
        <a href="/blog.html">Blog</a>
    </nav>
    
    <main>
        <article>
            <h1>{{ page.title }}</h1>
            <p class="date">{{ page.date | date: "%B %d, %Y" }}</p>
            {{ content }}
        </article>
        <a href="/blog.html" class="back-link">← Back to Blog</a>
    </main>
</body>
</html>
