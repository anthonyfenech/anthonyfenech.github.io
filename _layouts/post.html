<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - Anthony Fenech</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        nav {
            text-align: center;
            margin-bottom: 60px;
            padding-top: 20px;
        }
        
        nav a {
            text-decoration: underline;
            color: #333;
            margin: 0 30px;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
        }
        
        nav a:hover {
            color: #666;
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            line-height: 1.3;
        }
        
        .post-date {
            font-size: 14px;
            color: #666;
            margin-bottom: 40px;
        }
        
        .content {
            font-size: 16px;
        }
        
        .content h2 {
            font-size: 20px;
            margin-top: 40px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .content p {
            margin-bottom: 20px;
        }
        
        .back-link {
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid #ddd;
        }
        
        .back-link a {
            color: #333;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="/index.html">BIO</a>
            <a href="/about.html">ABOUT</a>
            <a href="/blog.html">BLOG</a>
            <a href="/contact.html">CONTACT</a>
        </nav>
        
        <article>
            <h1>{{ page.title }}</h1>
            <p class="post-date">{{ page.date | date: "%B %d, %Y" }}</p>
            
            <div class="content">
                {{ content }}
            </div>
            
            <div class="back-link">
                <a href="/blog.html">← Back to Blog</a>
            </div>
        </article>
    </div>
</body>
</html>
