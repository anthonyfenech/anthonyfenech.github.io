<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Results - The OTR Files</title>

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/search.css">
</head>
<body data-page="search">

  <!-- EXACT SAME HEADER AS INDEX.HTML -->
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="site-logo">
        <span class="accent">OTR</span> FILES
      </a>
      <nav class="site-nav">
        <a href="index.html" class="active">Search</a>
        <a href="browse.html">Browse</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">

      <!-- Search Bar -->
      <form id="search-form" class="search-bar-top">
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search documents..."
          name="q"
        >
        <button type="submit" class="search-button">SEARCH</button>
      </form>

      <!-- Results -->
      <div class="results-header">
        <p id="results-count"></p>
      </div>

      <div id="results-grid" class="results-grid"></div>

    </div>
  </main>

  <!-- EXACT SAME FOOTER AS INDEX.HTML -->
  <footer class="site-footer">
    <div class="container">
      <p>THE OTR FILES — From the archive of Anthony Fenech</p>
      <p><a href="https://anthonyfenech.github.io/off-the-record/">Read the book: OFF-THE-RECORD</a></p>
    </div>
  </footer>

  <script type="module" src="js/documents.js"></script>
  <script type="module" src="js/search-page.js"></script>
</body>
</html>
