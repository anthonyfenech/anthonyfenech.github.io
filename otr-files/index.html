<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE OTR FILES | Classified Document Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0f19;
            --card-bg: #111827;
            --card-border: #1f2937;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-red: #C0392B;
            --accent-navy: #1B2A4A;
            --accent-blue: #007AFF;
            --badge-red: #991b1b;
            --badge-amber: #92400e;
            --badge-gray: #374151;
            --badge-green: #166534;
        }

        body {
            font-family: 'Source Serif 4', Georgia, serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Header */
        .header {
            background: linear-gradient(180deg, var(--accent-navy) 0%, var(--bg-dark) 100%);
            padding: 40px 20px 30px;
            text-align: center;
            border-bottom: 1px solid var(--card-border);
        }

        .header h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .header .subtitle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            color: var(--accent-red);
            text-transform: uppercase;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 15px 20px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--card-border);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
        }

        .stat-value {
            color: var(--accent-red);
            font-weight: 600;
        }

        /* Container */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* Search */
        .search-container {
            margin-bottom: 25px;
        }

        .search-wrapper {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 15px;
        }

        .search-prompt {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-red);
            font-size: 0.9rem;
            margin-right: 10px;
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            padding: 15px 0;
            outline: none;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-btn {
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 8px 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            cursor: pointer;
            border-radius: 3px;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background: #a93226;
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            padding: 8px 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: var(--text-muted);
            color: var(--text-primary);
        }

        .filter-btn.active {
            background: var(--accent-navy);
            border-color: var(--accent-navy);
            color: var(--text-primary);
        }

        /* Results */
        .results-header {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Document Card */
        .doc-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 18px 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .doc-card:hover {
            border-color: var(--text-muted);
            transform: translateY(-1px);
        }

        .doc-card-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }

        .doc-icon {
            font-size: 1.5rem;
            line-height: 1;
        }

        .doc-meta {
            flex: 1;
        }

        .doc-badges {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
        }

        .badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            padding: 3px 8px;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .badge-type {
            background: var(--accent-navy);
            color: var(--text-primary);
        }

        .badge-classification {
            color: white;
        }

        .badge-heavily-redacted { background: var(--badge-red); }
        .badge-classified { background: var(--badge-amber); }
        .badge-redacted { background: var(--badge-gray); }
        .badge-unredacted { background: var(--badge-green); }

        .doc-date {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .doc-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .doc-preview {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .doc-participants {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .participant-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            background: rgba(192, 57, 43, 0.2);
            color: var(--accent-red);
            padding: 3px 8px;
            border-radius: 3px;
            border: 1px solid rgba(192, 57, 43, 0.3);
        }

        /* Document Viewer */
        .viewer {
            display: none;
        }

        .viewer.active {
            display: block;
        }

        .search-view.hidden {
            display: none;
        }

        .viewer-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
        }

        .back-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            padding: 10px 18px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            border-color: var(--text-muted);
            color: var(--text-primary);
        }

        .viewer-title-area {
            flex: 1;
        }

        .viewer-id {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            margin-bottom: 4px;
        }

        .viewer-title {
            font-size: 1.4rem;
            font-weight: 600;
        }

        /* Message Bubbles (Text Type) */
        .phone-frame {
            background: #000;
            border-radius: 30px;
            padding: 20px 15px;
            max-width: 380px;
            margin: 0 auto 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .phone-notch {
            width: 120px;
            height: 25px;
            background: #1a1a1a;
            border-radius: 0 0 15px 15px;
            margin: -20px auto 15px;
        }

        .messages-container {
            background: #000;
            min-height: 200px;
            padding: 10px;
        }

        .message-group {
            margin-bottom: 15px;
        }

        .message-sender {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            padding-left: 12px;
        }

        .message-sender.outgoing {
            text-align: right;
            padding-right: 12px;
            padding-left: 0;
        }

        .message-bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .message-bubble.incoming {
            background: var(--badge-gray);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        .message-bubble.outgoing {
            background: var(--accent-blue);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        /* Email Type */
        .email-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .email-header {
            background: var(--accent-navy);
            padding: 20px;
            border-bottom: 1px solid var(--card-border);
        }

        .email-field {
            display: flex;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .email-field:last-child {
            margin-bottom: 0;
        }

        .email-label {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            color: var(--text-muted);
            width: 70px;
            flex-shrink: 0;
        }

        .email-value {
            color: var(--text-primary);
        }

        .email-body {
            padding: 25px;
            font-size: 1rem;
            line-height: 1.7;
        }

        /* Tweet Type */
        .tweet-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            max-width: 550px;
            margin: 0 auto 30px;
        }

        .tweet-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .tweet-avatar {
            width: 48px;
            height: 48px;
            background: var(--accent-navy);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .tweet-user-info {
            flex: 1;
        }

        .tweet-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .tweet-handle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .tweet-body {
            font-size: 1.15rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .tweet-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            padding-top: 12px;
            border-top: 1px solid var(--card-border);
        }

        /* Metadata Section */
        .doc-metadata {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 20px;
        }

        .metadata-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .metadata-row {
            display: flex;
            margin-bottom: 12px;
        }

        .metadata-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            width: 100px;
            flex-shrink: 0;
        }

        .metadata-value {
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .metadata-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .clickable-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            background: rgba(192, 57, 43, 0.15);
            color: var(--accent-red);
            padding: 4px 10px;
            border-radius: 3px;
            border: 1px solid rgba(192, 57, 43, 0.3);
            cursor: pointer;
            transition: all 0.2s;
        }

        .clickable-tag:hover {
            background: rgba(192, 57, 43, 0.3);
        }

        .priority-bar {
            display: flex;
            gap: 3px;
        }

        .priority-pip {
            width: 8px;
            height: 8px;
            background: var(--card-border);
            border-radius: 2px;
        }

        .priority-pip.active {
            background: var(--accent-red);
        }

        /* Context Box */
        .context-box {
            background: rgba(27, 42, 74, 0.3);
            border-left: 3px solid var(--accent-navy);
            padding: 15px 20px;
            margin-bottom: 25px;
            font-style: italic;
            color: var(--text-secondary);
        }

        /* No Results */
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .no-results-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .stats-bar {
                flex-wrap: wrap;
                gap: 15px;
            }

            .filters {
                flex-wrap: wrap;
            }

            .phone-frame {
                border-radius: 20px;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>THE OTR FILES</h1>
        <div class="subtitle">Classified Document Archive</div>
    </header>

    <div class="stats-bar">
        <div class="stat">
            <span>DOCUMENTS:</span>
            <span class="stat-value" id="totalDocs">10</span>
        </div>
        <div class="stat">

    <div class="container">
        <!-- Search View -->
        <div class="search-view" id="searchView">
            <div class="search-container">

                    <span class="search-prompt mono">&gt;</span>
                    <input type="text" class="search-input" id="searchInput" placeholder="Search documents..." autocomplete="off">
                    <button class="search-btn" id="searchBtn">SEARCH</button>
                </div>
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">ALL</button>
                    <button class="filter-btn" data-filter="text">TEXT</button>

        <!-- Document Viewer -->
        <div class="viewer" id="viewer">

                <button class="back-btn" id="backBtn">
                    <span>&larr;</span>

                <div class="viewer-title-area">

                    <div class="doc-badges" id="viewerBadges"></div>
                    <h2 class="viewer-title" id="viewerTitle"></h2>
                </div>
            </div>

            <div id="viewerContext"></div>
            <div id="viewerContent"></div>
            <div class="doc-metadata" id="viewerMetadata"></div>
        </div>
    </div>

        // ============================================
        // STATE

        let currentFilter = 'all';

        // ============================================
        // ELEMENTS
        // ============================================
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsList = document.getElementById('resultsList');

        const searchView = document.getElementById('searchView');

        // ============================================
        // UTILITIES
        // ============================================
        function getTypeIcon(type) {
            const icons = {
                text: '💬',
                email: '📧',
                tweet: '🐦'
            };
            return icons[type] || '📄';
        }

        function getClassificationClass(classification) {
            const classes = {
                'HEAVILY REDACTED': 'badge-heavily-redacted',
                'CLASSIFIED': 'badge-classified',
                'REDACTED': 'badge-redacted',
                'UNREDACTED': 'badge-unredacted'
            };
            return classes[classification] || 'badge-gray';
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        function getParticipants(doc) {
            const participants = [];
            if (doc.from) participants.push(doc.from);
            if (doc.to && doc.to !== 'Public' && doc.to !== 'Media') participants.push(doc.to);
            if (doc.reply_from) participants.push(doc.reply_from);
            return [...new Set(participants)];
        }

        // ============================================
        // SEARCH & FILTER
        // ============================================
        function filterDocuments() {
            const query = currentQuery.toLowerCase();

            return OTR_DOCUMENTS.filter(doc => {
                // Type filter
                if (currentFilter !== 'all' && doc.type !== currentFilter) {
                    return false;
                }

                // Search query
                if (query) {
                    const searchFields = [
                        doc.title,
                        doc.from,
                        doc.to,
                        doc.content,
                        doc.reply_content || '',
                        ...doc.subjects
                    ].join(' ').toLowerCase();

                    return searchFields.includes(query);
                }

                return true;
            });
        }

        function renderResults() {
            const docs = filterDocuments();
            resultsHeader.textContent = `SHOWING ${docs.length} DOCUMENT${docs.length !== 1 ? 'S' : ''}`;

            if (docs.length === 0) {
                resultsList.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">🔍</div>
                        <div>No documents found matching your criteria.</div>
                    </div>
                `;
                return;
            }

            resultsList.innerHTML = docs.map(doc => `
                <div class="doc-card" data-id="${doc.id}">
                    <div class="doc-card-header">
                        <span class="doc-icon">${getTypeIcon(doc.type)}</span>
                        <div class="doc-meta">
                            <div class="doc-badges">
                                <span class="badge badge-type">${doc.type.toUpperCase()}</span>
                                <span class="badge badge-classification ${getClassificationClass(doc.classification)}">${doc.classification}</span>
                            </div>
                            <div class="doc-date mono">${formatDate(doc.date)}</div>
                        </div>
                    </div>
                    <div class="doc-title">${doc.title}</div>
                    <div class="doc-preview">${doc.content}</div>
                    <div class="doc-participants">
                        ${getParticipants(doc).map(p => `<span class="participant-tag">${p}</span>`).join('')}
                    </div>
                </div>
            `).join('');

            // Add click handlers
            document.querySelectorAll('.doc-card').forEach(card => {
                card.addEventListener('click', () => openDocument(card.dataset.id));
            });
        }

        // ============================================
        // DOCUMENT VIEWER
        // ============================================
        function openDocument(id) {
            const doc = OTR_DOCUMENTS.find(d => d.id === id);
            if (!doc) return;

            lastQuery = currentQuery;

            // Update header
            document.getElementById('viewerId').textContent = doc.id;
            document.getElementById('viewerTitle').textContent = doc.title;
            document.getElementById('viewerBadges').innerHTML = `
                <span class="badge badge-type">${doc.type.toUpperCase()}</span>
                <span class="badge badge-classification ${getClassificationClass(doc.classification)}">${doc.classification}</span>
            `;

            // Context
            const contextEl = document.getElementById('viewerContext');
            if (doc.context) {
                contextEl.innerHTML = `<div class="context-box">${doc.context}</div>`;
            } else {
                contextEl.innerHTML = '';
            }

            // Content based on type
            const contentEl = document.getElementById('viewerContent');

            if (doc.type === 'text') {
                contentEl.innerHTML = renderTextMessage(doc);
            } else if (doc.type === 'email') {
                contentEl.innerHTML = renderEmail(doc);
            } else if (doc.type === 'tweet') {
                contentEl.innerHTML = renderTweet(doc);
            }

            // Metadata
            document.getElementById('viewerMetadata').innerHTML = renderMetadata(doc);

            // Add click handlers for tags
            document.querySelectorAll('.clickable-tag').forEach(tag => {
                tag.addEventListener('click', () => {
                    currentQuery = tag.dataset.search;
                    searchInput.value = currentQuery;
                    closeViewer();
                    renderResults();
                });
            });

            // Show viewer
            searchView.classList.add('hidden');
            viewer.classList.add('active');
        }

        function renderTextMessage(doc) {
            const isOutgoing = doc.from === 'Anthony Fenech';

            let messagesHTML = `
                <div class="message-group">
                    <div class="message-sender ${isOutgoing ? 'outgoing' : ''}">${doc.from}</div>
                    <div class="message-bubble ${isOutgoing ? 'outgoing' : 'incoming'}">${doc.content}</div>
                </div>
            `;

            if (doc.reply_content) {
                const replyOutgoing = doc.reply_from === 'Anthony Fenech';
                messagesHTML += `
                    <div class="message-group">
                        <div class="message-sender ${replyOutgoing ? 'outgoing' : ''}">${doc.reply_from}</div>
                        <div class="message-bubble ${replyOutgoing ? 'outgoing' : 'incoming'}">${doc.reply_content}</div>
                    </div>
                `;
            }

            return `
                <div class="phone-frame">
                    <div class="phone-notch"></div>
                    <div class="messages-container">
                        ${messagesHTML}
                    </div>
                </div>
            `;
        }

        function renderEmail(doc) {
            return `
                <div class="email-container">
                    <div class="email-header">
                        <div class="email-field">
                            <span class="email-label">From:</span>
                            <span class="email-value">${doc.from}</span>
                        </div>
                        <div class="email-field">
                            <span class="email-label">To:</span>
                            <span class="email-value">${doc.to}</span>
                        </div>
                        <div class="email-field">
                            <span class="email-label">Date:</span>
                            <span class="email-value">${formatDate(doc.date)}</span>
                        </div>
                        <div class="email-field">
                            <span class="email-label">Subject:</span>
                            <span class="email-value">${doc.title}</span>
                        </div>
                    </div>
                    <div class="email-body">${doc.content}</div>
                </div>
            `;
        }

        function renderTweet(doc) {
            const handle = doc.from.match(/@\w+/) ? doc.from.match(/@\w+/)[0] : '@unknown';
            const name = doc.from.replace(/\s*\(@.*\)/, '');

            return `
                <div class="tweet-container">
                    <div class="tweet-header">
                        <div class="tweet-avatar">🐦</div>
                        <div class="tweet-user-info">
                            <div class="tweet-name">${name}</div>
                            <div class="tweet-handle">${handle}</div>
                        </div>
                    </div>
                    <div class="tweet-body">${doc.content}</div>
                    <div class="tweet-time">${formatDate(doc.date)}</div>
                </div>
            `;
        }

        function renderMetadata(doc) {
            const participants = getParticipants(doc);
            const priorityPips = Array(10).fill(0).map((_, i) =>
                `<div class="priority-pip ${i < doc.priority ? 'active' : ''}"></div>`
            ).join('');

            return `
                <div class="metadata-title">DOCUMENT METADATA</div>
                <div class="metadata-row">
                    <span class="metadata-label">Date:</span>
                    <span class="metadata-value">${formatDate(doc.date)}</span>
                </div>
                <div class="metadata-row">
                    <span class="metadata-label">Participants:</span>
                    <div class="metadata-tags">
                        ${participants.map(p => `<span class="clickable-tag" data-search="${p}">${p}</span>`).join('')}
                    </div>
                </div>
                <div class="metadata-row">
                    <span class="metadata-label">Subjects:</span>
                    <div class="metadata-tags">
                        ${doc.subjects.map(s => `<span class="clickable-tag" data-search="${s}">${s}</span>`).join('')}
                    </div>
                </div>
                <div class="metadata-row">
                    <span class="metadata-label">Priority:</span>
                    <div class="priority-bar">${priorityPips}</div>
                </div>
            `;
        }

        function closeViewer() {
            viewer.classList.remove('active');
            searchView.classList.remove('hidden');
        }

        // ============================================
        // EVENT HANDLERS
        // ============================================
        searchInput.addEventListener('input', (e) => {
            currentQuery = e.target.value;
            renderResults();
        });

        searchBtn.addEventListener('click', () => {
            currentQuery = searchInput.value;
            renderResults();
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                currentQuery = searchInput.value;
                renderResults();
            }
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderResults();
            });
        });

        backBtn.addEventListener('click', closeViewer);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && viewer.classList.contains('active')) {
                closeViewer();
            }
        });

        // ============================================
        // INIT
        // ============================================
        renderResults();
    </script>
</body>
</html>
