<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search - The OTR Files</title>

  <!-- CORE CSS - EXACT ORDER -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/home.css">
</head>
<body data-page="index">

  <!-- HEADER -->
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="site-logo">
        <span class="accent">OTR</span> FILES
      </a>
      <nav class="site-nav">
        <a href="index.html" class="active">Search</a>
        <a href="browse.html">Browse</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- HERO SECTION -->
    <section class="hero">
      <div class="container">
        <h1 class="hero-title">THE OTR FILES</h1>
        <p class="hero-subtitle">
          CLASSIFIED DOCUMENTS FROM FIVE SEASONS COVERING THE DETROIT TIGERS
        </p>
        <p class="hero-doc-count">
          <span id="doc-count">10</span> DOCUMENTS INDEXED
        </p>

        <!-- Search Form -->
        <form id="search-form" class="search-container">
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="Search documents, names, dates..."
            name="q"
          >
          <button type="submit" class="search-button">SEARCH</button>
        </form>

        <!-- Filter Chips -->
        <div class="filter-bar">
          <button class="filter-chip active" data-type="">ALL</button>
          <button class="filter-chip" data-type="text">TEXT</button>
          <button class="filter-chip" data-type="email">EMAIL</button>
          <button class="filter-chip" data-type="tweet">TWEET</button>
        </div>
      </div>
    </section>

    <!-- Featured Documents -->
    <section class="featured-section">
      <div class="container">
        <h2 class="section-heading">FEATURED DOCUMENTS</h2>
        <div id="featured-grid" class="document-grid"></div>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container">
      <p>THE OTR FILES — From the archive of Anthony Fenech</p>
      <p><a href="https://anthonyfenech.github.io/off-the-record/">Read the book: OFF-THE-RECORD</a></p>
    </div>
  </footer>

  <script type="module" src="js/documents.js"></script>
  <script type="module" src="js/homepage.js"></script>
</body>
</html>
