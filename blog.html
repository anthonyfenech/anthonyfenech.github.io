<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Anthony Fenech</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background-color: #fefefe;
            color: #333;
            line-height: 1.6;
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
            overflow-y: scroll;
        }
        
        .header {
            text-align: center;
            margin-bottom: 60px;
        }
        
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 40px;
            width: 100%;
            margin-bottom: 40px;
        }
        
        .nav-link {
            color: #333;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-bottom: 2px;
            transition: text-decoration-color 0.3s ease;
            position: relative;
            display: inline-block;
        }
        
        .nav-link.underlined {
            text-decoration: underline;
            text-decoration-color: #333;
            text-decoration-thickness: 2px;
            text-underline-offset: 2px;
        }
        
        .nav-link:hover {
            text-decoration: underline;
            text-decoration-color: #333;
            text-decoration-thickness: 2px;
            text-underline-offset: 2px;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .letter-o {
            position: relative;
            display: inline-block;
        }
        
        .red-dot {
            position: absolute;
            top: 48%;
            left: 46%;
            transform: translate(-50%, -50%);
            width: 5px;
            height: 5px;
            background-color: #e31c1c;
            border-radius: 50%;
        }
        
        h2 {
            font-size: 18px;
            margin-top: 40px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .content {
            font-size: 16px;
        }
        
        p {
            margin-bottom: 20px;
        }
        
        ul {
            margin-left: 20px;
            margin-bottom: 20px;
        }
        
        li {
            margin-bottom: 10px;
        }
        
        @media (max-width: 600px) {
            .nav-links {
                flex-direction: column;
                gap: 20px;
                align-items: center;
            }
            
            body {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav-links">
            <a href="index.html" class="nav-link underlined">Home</a>
            <a href="bio.html" class="nav-link underlined">Bio</a>
            <a href="blog.html" class="nav-link underlined">Blog</a>
            <a href="contact.html" class="nav-link underlined">Contact</a>
        </nav>
        <h1>BL<span class="letter-o">O<span class="red-dot"></span></span>G</h1>
    </header>

    <div class="content" style="text-align: center;">
        <iframe src="https://anthonyfenech.substack.com/embed" width="480" height="320" style="border:1px solid #EEE; background:white; max-width: 100%;" frameborder="0" scrolling="no"></iframe>
    </div>
</body>
</html>
