<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Anthony Fenech</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.6;
            color: #333;
            overflow-y: scroll;
        }
        
        nav {
            background: #2c3e50;
            padding: 1rem 2rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        nav a {
            color: white;
            text-decoration: none;
            margin-right: 2rem;
            font-weight: 500;
        }
        
        nav a:hover, nav a.active {
            color: #3498db;
        }
        
        main {
            max-width: 800px;
            margin: 3rem auto;
            padding: 0 2rem;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 2rem;
            font-size: 2.5rem;
        }
        
        article {
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid #eee;
        }
        
        article h2 {
            margin-bottom: 0.5rem;
        }
        
        article h2 a {
            color: #2c3e50;
            text-decoration: none;
        }
        
        article h2 a:hover {
            color: #3498db;
        }
        
        .date {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        
        article p {
            color: #555;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="bio.html">Bio</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="blog.html" class="active">Blog</a>
    </nav>
    
    <main>
        <h1>Blog</h1>
        
        {% for post in site.posts %}
        <article>
            <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
            <p class="date">{{ post.date | date: "%B %d, %Y" }}</p>
            <p>{{ post.excerpt | strip_html | truncate: 200 }}</p>
        </article>
        {% endfor %}
    </main>
</body>
</html>
