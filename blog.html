<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Anthony Fenech</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background-color: #fefefe;
            color: #333;
            line-height: 1.6;
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 60px;
        }
        
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 40px;
            width: 100%;
            margin-bottom: 40px;
        }
        
        .nav-link {
            color: #333;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-bottom: 2px;
            transition: text-decoration-color 0.3s ease;
            position: relative;
            display: inline-block;
        }
        
        .nav-link.underlined {
            text-decoration: underline;
            text-decoration-color: #333;
            text-decoration-thickness: 2px;
            text-underline-offset: 2px;
        }
        
        .nav-link:hover {
            text-decoration: underline;
            text-decoration-color: #333;
            text-decoration-thickness: 2px;
            text-underline-offset: 2px;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .post {
            margin-bottom: 40px;
            padding-bottom: 40px;
            border-bottom: 1px solid #ddd;
        }
        
        .post:last-child {
            border-bottom: none;
        }
        
        .post-title {
            font-size: 20px;
            margin-bottom: 10px;
        }
        
        .post-title a {
            color: #333;
            text-decoration: underline;
        }
        
        .post-title a:hover {
            color: #666;
        }
        
        .post-date {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }
        
        .post-excerpt {
            font-size: 16px;
        }
        
        .footer {
            text-align: center;
            margin-top: 200px;
            padding-top: 40px;
            border-top: 1px solid #eee;
            color: #666;
            font-size: 14px;
            position: relative;
        }
        
        .social-icons {
            position: absolute;
            bottom: 10px;
            right: 0;
            display: flex;
            gap: 15px;
        }
        
        .social-icon {
            font-size: 24px;
            text-decoration: none;
            transition: transform 0.3s ease;
        }
        
        .social-icon:hover {
            transform: scale(1.2);
        }
        
        .twitter {
            color: #1DA1F2;
        }
        
        .instagram {
            color: #E4405F;
        }
        
        @media (max-width: 600px) {
            .nav-links {
                flex-direction: column;
                gap: 20px;
                align-items: center;
            }
            
            body {
                padding: 20px 15px;
            }
            
            .social-icons {
                position: static;
                justify-content: center;
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav-links">
            <a href="index.html" class="nav-link underlined">Home</a>
            <a href="bio.html" class="nav-link underlined">Bio</a>
            <a href="about.html" class="nav-link underlined">About</a>
            <a href="blog.html" class="nav-link underlined">Blog</a>
            <a href="contact.html" class="nav-link underlined">Contact</a>
        </nav>
    </header>
    
    <h1>Blog</h1>
    
    {% for post in site.posts %}
    <div class="post">
        <h2 class="post-title">
            <a href="{{ post.url }}">{{ post.title }}</a>
        </h2>
        <p class="post-date">{{ post.date | date: "%B %d, %Y" }}</p>
        <div class="post-excerpt">
            {{ post.excerpt }}
        </div>
    </div>
    {% endfor %}
    
    <footer class="footer">
        <p></p>
        <div class="social-icons">
            <a href="https://twitter.com/anthonyfenech" target="_blank" class="social-icon twitter" aria-label="Twitter">𝕏</a>
            <a href="https://instagram.com/afen10" target="_blank" class="social-icon instagram" aria-label="Instagram">📷</a>
        </div>
    </footer>
</body>
</html>
