<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Anthony Fenech</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background-color: #fefefe;
            color: #333;
            line-height: 1.6;
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
            overflow-y: scroll;
        }
        
        .header {
            text-align: center;
            margin-bottom: 60px;
        }
        
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 40px;
            width: 100%;
            margin-bottom: 40px;
        }
        
        .nav-link {
            color: #333;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-bottom: 2px;
            transition: text-decoration-color 0.3s ease;
            position: relative;
            display: inline-block;
        }
        
        .nav-link.underlined {
            text-decoration: underline;
            text-decoration-color: #333;
            text-decoration-thickness: 2px;
            text-underline-offset: 2px;
        }
        
        .nav-link:hover {
            text-decoration: underline;
            text-decoration-color: #333;
            text-decoration-thickness: 2px;
            text-underline-offset: 2px;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .content {
            font-size: 16px;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }
        
        .contact-icon {
            font-size: 28px;
            width: 40px;
            text-align: center;
        }
        
        .email-icon {
            color: #333;
        }
        
        .twitter-icon {
            color: #1DA1F2;
        }
        
        .instagram-icon {
            color: #E4405F;
        }
        
        p {
            margin-bottom: 20px;
        }
        
        strong {
            font-weight: bold;
        }
        
        @media (max-width: 600px) {
            .nav-links {
                flex-direction: column;
                gap: 20px;
                align-items: center;
            }
            
            body {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav-links">
            <a href="index.html" class="nav-link underlined">Home</a>
            <a href="bio.html" class="nav-link underlined">Bio</a>
            <a href="about.html" class="nav-link underlined">About</a>
            <a href="blog.html" class="nav-link underlined">Blog</a>
            <a href="contact.html" class="nav-link underlined">Contact</a>
        </nav>

        <h1>Contact</h1>
    </header>
    
    <div class="content">
        <div class="contact-item">
            <span class="contact-icon email-icon">✉</span>
            <p><strong>Email:</strong> anthonyfenech@hotmail.com</p>
        </div>
        
        <div class="contact-item">
            <span class="contact-icon twitter-icon">𝕏</span>
            <p><strong>Twitter:</strong> @anthonyfenech</p>
        </div>
        
        <div class="contact-item">
            <span class="contact-icon instagram-icon">📷</span>
            <p><strong>Instagram:</strong> @afen10</p>
        </div>
        
        <p style="margin-top: 40px;">For book inquiries, media requests, or general questions.</p>
    </div>
</body>
</html>
